# Qdrant only. Everything else runs on the host so the edit loop stays fast.
services:
  qdrant:
    image: qdrant/qdrant:v1.15.1
    container_name: hindsight-qdrant
    ports:
      - "6333:6333"   # REST + dashboard at http://localhost:6333/dashboard
      - "6334:6334"   # gRPC
    volumes:
      - ./.qdrant_storage:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
