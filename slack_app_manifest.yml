# Slack app manifest for Provenance: live ingest (read-only) plus the on-demand bot.
#
# Create it at https://api.slack.com/apps -> Create New App -> From a manifest, in the
# workspace you want to read. If you already made an app from an earlier version of
# this file, paste this one into "App Manifest" and reinstall instead.
#
# After installing, the hosted workspace bot needs two values in its secret store:
#   SLACK_BOT_TOKEN   "OAuth & Permissions" -> Bot User OAuth Token (xoxb-...)
#   SLACK_APP_TOKEN   "Basic Information" -> App-Level Tokens -> new token with
#                     the `connections:write` scope                (xapp-...)
#
# Keep it an INTERNAL app: never enable distribution or list it in the Marketplace.
# Since 2025-05-29 Slack limits conversations.history / conversations.replies to 1
# request per minute (15 messages each) for distributed non-Marketplace apps; internal
# apps keep the normal limits, which a full-history backfill needs.
#
# The bot reads only the channels the deployment allows in SLACK_BOT_CHANNEL_IDS.
# With `SLACK_BOT_CHANNEL_IDS=*`, it joins public channels on first use. Invite it to
# every private allowed channel. Reactions arrive with the message
# payload, so no reactions:read is needed; reactions:write preserves short indexed
# conversations during later reconciliation.
display_information:
  name: Provenance
  description: Indexes a Slack conversation so it surfaces next to the code it explains.
features:
  bot_user:
    display_name: Provenance
    always_online: false
  slash_commands:
    - command: /provenance
      description: Index a Slack conversation into Provenance
      usage_hint: "[message link] — no argument picks from recent conversations"
      should_escape: false
  shortcuts:
    - name: Index in Provenance
      type: message
      callback_id: index_thread
      description: Make this conversation findable from the code it explains
oauth_config:
  # Where Slack sends the browser back after someone connects their own account for
  # private indexing. Loopback only: the authorization code is exchanged on the
  # device, so no server ever sees the resulting user token. Slack matches this
  # exactly, hence the pinned port -- start the connector with
  # PROVENANCE_LOCAL_PORT=51737.
  redirect_urls:
    - http://127.0.0.1:51737/v1/auth/slack/callback
  scopes:
    # `user` scopes are for the *private* half of Backfill and are granted by each
    # person individually, in the browser, to the connector on their own machine.
    # They are what lets someone index the private channels they can read without
    # any of it reaching the shared index. The hosted bot never receives them.
    user:
      - channels:history
      - channels:read
      - groups:history
      - groups:read
      - users:read
    bot:
      - commands
      - chat:write
      - channels:history
      - channels:read
      - channels:join
      - groups:history
      - groups:read
      - users:read
      - reactions:write
settings:
  org_deploy_enabled: false
  # Socket Mode: the bot dials out to Slack, so it runs on a laptop with no public
  # URL and no tunnel. This is why SLACK_APP_TOKEN exists.
  socket_mode_enabled: true
  token_rotation_enabled: false
  interactivity:
    is_enabled: true
