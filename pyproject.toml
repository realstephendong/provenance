# Present so the `provenance` console command in 15 actually exists after
# `pip install -e .`. Everything else runs fine via `python -m ...`.
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "provenance"
version = "1.0.0"
description = "Recover the evidence chain behind a piece of code."
requires-python = ">=3.12"
dynamic = ["dependencies"]

[project.scripts]
provenance = "provenance.cli.main:main"
# The private connector. A console script rather than `python -m`, because the
# editor spawns it and its working directory is the open folder, not this repo.
provenance-local = "provenance.local_agent.main:main"

[tool.setuptools]
packages = [
    "provenance",
    "provenance.integrations",
    "provenance.ingest",
    "provenance.slackbot",
    "provenance.service",
    "provenance.mcp_server",
    "provenance.local_agent",
    "provenance.cli",
]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }
